<figure class="tp">
  <figcaption class="tp__caption">
    <span class="tp__title">Transfers vs. delay</span>
    <span class="tp__legend">
      <span class="tp__key tp__key--ai"></span>AI
      <span class="tp__key tp__key--human"></span>you
    </span>
  </figcaption>

  <svg
    class="tp__svg"
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    role="img"
    aria-label="Planned transfers broken against predicted delay reduction, one dot per action version"
  >
    <defs>
      <marker id="tp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" class="tp__arrow-head" />
      </marker>
    </defs>

    <!-- Grid before axes so the axis lines stay the crispest thing on the plane. -->
    @for (x of grid().xs; track x) {
      <line class="tp__grid" [attr.x1]="x" [attr.y1]="box().top" [attr.x2]="x" [attr.y2]="box().bottom" />
    }
    @for (y of grid().ys; track y) {
      <line class="tp__grid" [attr.x1]="box().left" [attr.y1]="y" [attr.x2]="box().right" [attr.y2]="y" />
    }

    <line class="tp__axis" [attr.x1]="box().left" [attr.y1]="box().top" [attr.x2]="box().left" [attr.y2]="box().bottom" />
    <line class="tp__axis" [attr.x1]="box().left" [attr.y1]="box().bottom" [attr.x2]="box().right" [attr.y2]="box().bottom" />

    <!-- Ends only, with units. The plot is for direction and distance; the cards
         carry the exact numbers. -->
    <text class="tp__tick" [attr.x]="box().left - 4" [attr.y]="box().top + 3" text-anchor="end">{{ axisLabels().energyLow }}</text>
    <text class="tp__tick" [attr.x]="box().left - 4" [attr.y]="box().bottom + 3" text-anchor="end">{{ axisLabels().energyHigh }}</text>
    <text class="tp__tick" [attr.x]="box().left" [attr.y]="height - 18" text-anchor="start">{{ axisLabels().delayLow }}</text>
    <text class="tp__tick" [attr.x]="box().right" [attr.y]="height - 18" text-anchor="end">{{ axisLabels().delayHigh }}</text>

    <text class="tp__axis-name" x="2" y="12" text-anchor="start">↑ transfers kept</text>
    <text class="tp__axis-name" [attr.x]="box().right" [attr.y]="height - 4" text-anchor="end">more delay saved →</text>

    <!-- The trade the dispatcher made, as a move on the plane. -->
    @for (a of arrows(); track a.packageId) {
      <g class="tp__trade" [class.is-dominating]="a.dominates">
        <line
          class="tp__arrow"
          [attr.x1]="a.x1" [attr.y1]="a.y1"
          [attr.x2]="a.x2" [attr.y2]="a.y2"
          marker-end="url(#tp-arrow)"
        />
        @if (a.showLabel) {
          <text
            class="tp__trade-label"
            [attr.x]="a.labelX"
            [attr.y]="a.labelY"
            text-anchor="middle"
          >{{ a.deltaMin > 0 ? '+' : '' }}{{ a.deltaMin }}′ / {{ a.deltaBroken > 0 ? '+' : '' }}{{ a.deltaBroken }} transfers</text>
        }
      </g>
    }

    @for (p of plotted(); track p.id) {
      <g
        class="tp__point"
        [class.is-active]="p.active"
        [attr.data-origin]="p.origin"
        (pointerenter)="onEnter(p.id)"
        (pointerleave)="onLeave()"
      >
        @if (p.recommended) {
          <circle class="tp__ring" [attr.cx]="p.x" [attr.cy]="p.y" [attr.r]="radius(p) + 3.5" />
        }
        <circle class="tp__dot" [attr.cx]="p.x" [attr.cy]="p.y" [attr.r]="radius(p)" />
        <text class="tp__mark" [attr.x]="p.x" [attr.y]="p.y + 3.5" text-anchor="middle">{{ p.label }}</text>
        @if (showValue(p)) {
          <text
            class="tp__value"
            [attr.x]="valueX(p)"
            [attr.y]="p.y + 3.5"
            [attr.text-anchor]="valueAnchor(p)"
          >{{ valueLabel(p) }}</text>
        }
      </g>
    }
  </svg>

  <p class="tp__readout">{{ readout() }}</p>
</figure>
