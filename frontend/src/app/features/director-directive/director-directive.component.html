<!-- One row: state on the left, run control on the right. Everything here is
     height the map and the tiles do not get, so it stays a single line. -->
<div class="directive" [class.is-running]="store.playing()" role="status">
  @if (store.playing()) {
    <span class="dir-dot" aria-hidden="true"></span>
    <span class="dir-lead">KI fährt</span>
  } @else {
    <span class="dir-icon" aria-hidden="true">▸</span>
    <span class="dir-lead">Bereit</span>
  }

  <span class="dir-stats">
    <span class="dir-stat">
      <strong>{{ active() }}</strong> aktiv
    </span>
    <span class="dir-stat" [class.warn]="delayedCount() > 0">
      <strong>{{ delayedCount() }}</strong> verspätet
    </span>
    <span class="dir-stat" [class.alert]="malfunctions() > 0">
      <strong>{{ malfunctions() }}</strong> Störung(en)
    </span>
    <span class="dir-stat">
      <strong>{{ arrived() }}/{{ total() }}</strong> angekommen
    </span>
  </span>

  <span class="dir-chip">{{ policyLabel() }}</span>

  <button class="dir-start" type="button" (click)="start()" [disabled]="store.playing()">
    {{ started() ? 'Fortsetzen' : 'Autonomen Lauf starten' }}
  </button>

  <!-- The way into the closing review. Without it the review waited for the
       episode to run out (400 steps), i.e. it was never reached — and with it
       the point where preferences get confirmed and saved. Re-openable, so this
       is not a decision the operator can regret. -->
  @if (started()) {
    <button class="dir-end" type="button" (click)="endShift()"
            title="Beendet die Schicht und zeigt die Auswertung — du kannst zurück.">
      Schicht beenden
    </button>
  }
</div>
