<div class="intro">
  <div class="intro-card">
    <span class="intro-step done">{{ 'complete.step' | transloco }}</span>

    <span class="intro-wp">{{ modesDone() }}</span>
    <sbb-title level="2" visual-level="3" class="intro-title">{{ 'complete.title' | transloco }}</sbb-title>
    <p class="intro-tagline">{{ tagline() }}</p>

    <div class="intro-actions">
      <sbb-button size="l" (click)="restart.emit()">{{ 'complete.restart' | transloco }}</sbb-button>
      <sbb-transparent-button size="m" (click)="exit.emit()">{{ 'complete.exit' | transloco }}</sbb-transparent-button>
    </div>
  </div>
</div>
